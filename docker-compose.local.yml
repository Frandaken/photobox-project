services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      no_cache: true
    container_name: app-frontend
    ports:
      - 8080:80
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      no_cache: true
    container_name: app-backend
    ports:
      - 3000:3000
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      app-network:
        aliases:
          - backend
          - app-backend

networks:
  app-network:
    driver: bridge
