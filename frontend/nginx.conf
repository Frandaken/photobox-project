server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Teruskan semua panggilan API ke service backend (nama service Docker
    # Compose "backend" otomatis bisa di-resolve sebagai hostname di
    # jaringan internal Docker).
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s; # upload gambar bisa agak lama
    }

    # SPA fallback: semua route yang tidak match file statis diarahkan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aset yang sudah punya hash di nama filenya (bawaan Vite build)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
