server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 50MB for high-resolution photobox composite & camera uploads
    client_max_body_size 50M;

    # Explicitly grant camera, microphone, and autoplay permissions across reverse proxies
    add_header Permissions-Policy "camera=*, microphone=*, display-capture=*" always;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Dynamic reverse proxy to the backend API service (Port 5795)
    location /api/ {
        set $backend_upstream "http://backend:5795";
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
