<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="50%" stop-color="#EDE7D9"/>
      <stop offset="100%" stop-color="#E2D9C5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1A16" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#1E1A16" stroke-width="4"/>

  <!-- Left Illustration: Classic Photo Strip -->
  <g transform="translate(110, 80) rotate(-6)" filter="url(#shadow)">
    <rect width="210" height="470" rx="12" fill="#FFFFFF" stroke="#1E1A16" stroke-width="3"/>
    <rect x="18" y="20" width="174" height="120" rx="6" fill="#F3C9BE" stroke="#1E1A16" stroke-width="2"/>
    <circle cx="105" cy="70" r="28" fill="#1E1A16" opacity="0.85"/>
    <ellipse cx="105" cy="120" rx="46" ry="30" fill="#1E1A16" opacity="0.85"/>

    <rect x="18" y="155" width="174" height="120" rx="6" fill="#C5DBC8" stroke="#1E1A16" stroke-width="2"/>
    <circle cx="105" cy="205" r="28" fill="#1E1A16" opacity="0.85"/>
    <ellipse cx="105" cy="255" rx="46" ry="30" fill="#1E1A16" opacity="0.85"/>

    <rect x="18" y="290" width="174" height="120" rx="6" fill="#FDE183" stroke="#1E1A16" stroke-width="2"/>
    <circle cx="105" cy="340" r="28" fill="#1E1A16" opacity="0.85"/>
    <ellipse cx="105" cy="390" rx="46" ry="30" fill="#1E1A16" opacity="0.85"/>

    <text x="105" y="440" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#1E1A16" text-anchor="middle">PHOTOBOX · 2026</text>
  </g>

  <!-- Main Copy -->
  <g transform="translate(420, 160)">
    <!-- Badge -->
    <rect x="0" y="0" width="190" height="36" rx="8" fill="#D8482E"/>
    <text x="95" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BILIK FOTO INSTAN</text>

    <!-- Title -->
    <text x="0" y="96" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#1E1A16">Photobox</text>

    <!-- Subtitle -->
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#5A5245" font-weight="500">
      Foto instan, pilih frame favoritmu &amp; bagikan momen seru.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#FFFFFF" stroke="#1E1A16" stroke-width="2"/>
      <text x="90" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1E1A16" text-anchor="middle">🎞 Strip &amp; Grid Frame</text>

      <rect x="195" y="0" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#1E1A16" stroke-width="2"/>
      <text x="280" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1E1A16" text-anchor="middle">✨ Dekorasi Stiker</text>

      <rect x="380" y="0" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#1E1A16" stroke-width="2"/>
      <text x="465" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1E1A16" text-anchor="middle">📱 QR Salinan Digital</text>
    </g>

    <!-- URL Tagline -->
    <text x="0" y="300" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#8A8073">
      AUTO-SAVE VOLUME NAS · NEXTCLOUD WEBDAV READY
    </text>
  </g>
</svg>
