services:
  frontend:
    build:
      context: https://github.com/Frandaken/photobox-project.git
      dockerfile: frontend/Dockerfile
      no_cache: true
    container_name: app-frontend
    ports:
      - "8010:80"
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

  backend:
    build:
      context: https://github.com/Frandaken/photobox-project.git
      dockerfile: backend/Dockerfile
      no_cache: true
    container_name: app-backend
    ports:
      - "5795:5795"
    env_file:
      - .env
    environment:
      - PORT=5795
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      # Ubah sisi kiri sesuai path penyimpanan NAS/lokal Anda:
      - /mnt/nas-pool/Share/PHOTOBOX:/app/data
    restart: unless-stopped
    networks:
      app-network:
        aliases:
          - backend
          - app-backend

networks:
  app-network:
    driver: bridge
