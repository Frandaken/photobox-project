services:
  frontend:
    build:
      context: ./frontend
    container_name: photobox-frontend
    ports:
      - "8088:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: photobox-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    restart: unless-stopped
